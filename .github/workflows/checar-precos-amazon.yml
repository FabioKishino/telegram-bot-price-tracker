name: Checar preços (Amazon)

# Separado e mais espaçado: a Amazon bloqueia scraping com frequência.
on:
  schedule:
    - cron: "23 */3 * * *" # a cada 3h
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: checar-precos-amazon
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Checar preços (Amazon)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.main --apenas amazon
